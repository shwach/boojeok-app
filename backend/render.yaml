services:
  - type: web
    name: boojeok-backend
    env: node
    buildCommand: npm install
    startCommand: npx tsx src/index.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: boojeok-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: boojeok-db
    databaseName: boojeok
    user: boojeok
    plan: free
